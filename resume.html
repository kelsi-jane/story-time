    /* Load Inter from Google Fonts */

    :root {

    }

        max-width: 850px;

        background: white;
        padding: 40px 60px;
        border-radius: 10px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    h1, h2, h3 {
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--accent);
    }

    h1 {
        font-size: 34px;
        margin-bottom: 0.2em;
    }

    h2 {
        font-size: 22px;
        margin-top: 1.6em;
        padding-bottom: 6px;
        border-bottom: 2px solid var(--border-light);

    }

    h3 {
        font-size: 18px;
        margin-bottom: 0.2em;
    }

    /* Lists */
    ul {

    }

    li {
        line-height: 1.45;
        margin-bottom: 0.35em;
        font-weight: 400;
        color: var(--text-light);
    }

</style>
